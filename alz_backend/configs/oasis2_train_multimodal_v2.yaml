# Reliability-focused OASIS-2 multimodal recipe.
#
# Goals for v2:
# - beat oasis2_multimodal_v1 test AUROC 0.7250
# - raise balanced accuracy to at least 0.68
# - raise subject-consensus AUROC to at least 0.72
# - reduce review burden below 31/60 and temporal paradoxes to at most 1
# OASIS-2 remains a longitudinal candidate; OASIS-1 stays the active fallback.

run_name: oasis2_multimodal_v2
epochs: 50
device: auto
mixed_precision: true
deterministic: true
dry_run: false

model:
  architecture: resnet50_multimodal

model_config_path: configs/oasis2_multimodal_model.yaml

data:
  batch_size: 2
  gradient_accumulation_steps: 4
  num_workers: 2
  cache_rate: 0.0
  image_size: [96, 96, 96]
  seed: 42
  split_seed: 42
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  weighted_sampling: true
  training_cohort: full
  max_train_batches:
  max_val_batches:

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  momentum: 0.9

scheduler:
  name: cosine
  step_size: 30
  gamma: 0.5
  patience: 5
  factor: 0.5

loss:
  name: focal_loss
  class_weights: [1.05, 1.0]
  focal_gamma: 1.0
  temporal_lambda: 0.15
  temporal_lambda_warmup_epochs: 8

early_stopping:
  enabled: true
  patience: 12
  min_delta: 0.001
  monitor: val_auroc
  mode: max

checkpoint:
  resume_from:
  init_from_checkpoint:
  save_best: true
  save_last: true
